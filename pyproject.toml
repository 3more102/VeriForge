[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "veriforge"
version = "0.1.0"
description = "A CLI-first verification gap explorer for SystemVerilog projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VeriForge contributors" }]
dependencies = []

[project.scripts]
veriforge = "veriforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
